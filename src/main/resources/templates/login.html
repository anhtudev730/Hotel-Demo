<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Đăng nhập hệ thống - Hotel Manager</title>
    <!-- Link Bootstrap 5 -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body { background-color: #f4f7f6; }
        .login-card { border-radius: 15px; border: none; }
        .btn-login { background-color: #2c3e50; color: white; transition: 0.3s; }
        .btn-login:hover { background-color: #1a252f; color: white; }
    </style>
</head>
<body>
    <div class="container d-flex justify-content-center align-items-center vh-100">
        <div class="card login-card shadow-lg p-4" style="width: 400px;">
            <div class="text-center mb-4">
                <h3 class="fw-bold">WELCOME BACK</h3>
                <p class="text-muted small">Vui lòng đăng nhập để tiếp tục</p>
            </div>

            <!-- 1. Thông báo khi đăng nhập sai -->
            <div th:if="${param.error}" class="alert alert-danger py-2 small" role="alert">
                Tên đăng nhập hoặc mật khẩu không chính xác!
            </div>

            <!-- 2. Thông báo khi vừa đăng xuất thành công -->
            <div th:if="${param.logout}" class="alert alert-success py-2 small" role="alert">
                Bạn đã đăng xuất thành công.
            </div>

            <!-- Form đăng nhập -->
            <form th:action="@{/login}" method="post">
                <div class="mb-3">
                    <label for="username" class="form-label small fw-bold">Tên đăng nhập</label>
                    <input type="text" class="form-control" id="username" name="username" 
                           placeholder="Nhập username" required autofocus>
                </div>
                <div class="mb-3">
                    <label for="password" class="form-label small fw-bold">Mật khẩu</label>
                    <input type="password" class="form-control" id="password" name="password" 
                           placeholder="Nhập mật khẩu" required>
                </div>
                
                <div class="d-grid gap-2 mt-4">
                    <button type="submit" class="btn btn-login py-2 fw-bold">ĐĂNG NHẬP</button>
                </div>
            </form>

            <div class="text-center mt-3">
                <span class="small text-muted">Chưa có tài khoản? </span>
                <a th:href="@{/register}" class="small text-decoration-none fw-bold">Đăng ký ngay</a>
            </div>
        </div>
    </div>
</body>
</html>
