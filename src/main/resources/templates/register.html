<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Đăng ký tài khoản - Hotel Manager</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body { background-color: #f4f7f6; }
        .register-card { border-radius: 15px; border: none; }
        .btn-register { background-color: #27ae60; color: white; transition: 0.3s; }
        .btn-register:hover { background-color: #219150; color: white; }
    </style>
</head>
<body>
    <div class="container d-flex justify-content-center align-items-center vh-100">
        <div class="card register-card shadow-lg p-4" style="width: 450px;">
            <div class="text-center mb-4">
                <h3 class="fw-bold">TẠO TÀI KHOẢN</h3>
                <p class="text-muted small">Trở thành thành viên của Hotel Manager</p>
            </div>

            <!-- Form Đăng ký -->
            <form th:action="@{/register}" method="post">
                <div class="mb-3">
                    <label class="form-label small fw-bold">Tên đăng nhập</label>
                    <input type="text" class="form-control" name="username" required>
                </div>
                <div class="mb-3">
                    <label class="form-label small fw-bold">Email</label>
                    <input type="email" class="form-control" name="email" required>
                </div>
                <div class="mb-3">
                    <label class="form-label small fw-bold">Mật khẩu</label>
                    <input type="password" class="form-control" name="password" required>
                </div>
                
                <div class="d-grid gap-2 mt-4">
                    <button type="submit" class="btn btn-register py-2 fw-bold">ĐĂNG KÝ NGAY</button>
                </div>
            </form>

            <div class="text-center mt-3">
                <span class="small text-muted">Đã có tài khoản? </span>
                <a th:href="@{/login}" class="small text-decoration-none fw-bold text-success">Đăng nhập</a>
            </div>
        </div>
    </div>
</body>
</html>
