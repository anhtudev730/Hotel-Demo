<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Bảng điều khiển - Dashboard</title>
    <div th:replace="~{common/header :: header-css}"></div>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">
</head>
<body>
    <div th:replace="~{common/navbar :: header}"></div>

    <div class="container mt-4">
        <h2 class="mb-4 text-secondary"><i class="bi bi-speedometer2"></i> Hệ Thống Quản Trị Khách Sạn</h2>
        
        <div class="row">
            <div class="col-md-3 mb-4">
                <div class="card bg-primary text-white shadow border-0">
                    <div class="card-body py-4">
                        <div class="d-flex justify-content-between align-items-center">
                            <div>
                                <h6 class="text-uppercase mb-1">Tổng Số Phòng</h6>
                                <h2 class="display-5 fw-bold" th:text="${totalRooms}">0</h2>
                            </div>
                            <i class="bi bi-house-door fs-1 opacity-50"></i>
                        </div>
                    </div>
                    <div class="card-footer d-flex align-items-center justify-content-between small">
                        <a class="text-white stretched-link" href="/manager/rooms">Xem chi tiết</a>
                        <i class="bi bi-chevron-right"></i>
                    </div>
                </div>
            </div>

            <div class="col-md-3 mb-4">
                <div class="card bg-success text-white shadow border-0">
                    <div class="card-body py-4">
                        <div class="d-flex justify-content-between align-items-center">
                            <div>
                                <h6 class="text-uppercase mb-1">Số Loại Phòng</h6>
                                <h2 class="display-5 fw-bold" th:text="${totalRoomTypes}">0</h2>
                            </div>
                            <i class="bi bi-tags fs-1 opacity-50"></i>
                        </div>
                    </div>
                    <div class="card-footer d-flex align-items-center justify-content-between small">
                        <a class="text-white stretched-link" href="/manager/room-types">Xem chi tiết</a>
                        <i class="bi bi-chevron-right"></i>
                    </div>
                </div>
            </div>

            <div class="col-md-3 mb-4">
                <div class="card bg-info text-white shadow border-0">
                    <div class="card-body py-4">
                        <div class="d-flex justify-content-between align-items-center">
                            <div>
                                <h6 class="text-uppercase mb-1">Đơn Đặt Phòng</h6>
                                <h2 class="display-5 fw-bold">List</h2>
                            </div>
                            <i class="bi bi-calendar-check fs-1 opacity-50"></i>
                        </div>
                    </div>
                    <div class="card-footer d-flex align-items-center justify-content-between small">
                        <a class="text-white stretched-link" href="/manager/bookings/list">Duyệt Đơn Ngay</a>
                        <i class="bi bi-chevron-right"></i>
                    </div>
                </div>
            </div>

            <div class="col-md-3 mb-4">
                <div class="card bg-warning text-dark shadow border-0">
                    <div class="card-body py-4">
                        <div class="d-flex justify-content-between align-items-center">
                            <div>
                                <h6 class="text-uppercase mb-1">Giá trị Loại Phòng</h6>
                                <h2 class="fs-4 fw-bold" th:text="${#numbers.formatDecimal(potentialRevenue, 0, 'COMMA', 0, 'POINT')} + ' đ'"></h2>
                            </div>
                            <i class="bi bi-currency-dollar fs-1 opacity-50"></i>
                        </div>
                    </div>
                    <div class="card-footer d-flex align-items-center justify-content-between small">
                        <span class="text-dark">Tổng giá niêm yết</span>
                        <i class="bi bi-graph-up-arrow"></i>
                    </div>
                </div>
            </div>
        </div>

        <div class="row mt-2">
            <div class="col-12">
                <div class="card border-0 shadow-sm p-4 text-center bg-light">
                    <h4>Chào Anh Tú, hôm nay bạn muốn làm gì?</h4>
                    <div class="mt-3">
                        <a href="/manager/rooms/add" class="btn btn-outline-primary mx-2 mb-2"><i class="bi bi-plus-circle"></i> Thêm Phòng Mới</a>
                        <a href="/manager/room-types/add" class="btn btn-outline-success mx-2 mb-2"><i class="bi bi-plus-square"></i> Thêm Loại Phòng</a>
                        <a href="/manager/bookings/list" class="btn btn-outline-info mx-2 mb-2"><i class="bi bi-clipboard-check"></i> Phê Duyệt Đặt Phòng</a>
                    </div>
                </div>
            </div>
        </div>
    </div>
</body>
</html>
