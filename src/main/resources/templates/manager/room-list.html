<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Quản lý danh sách phòng</title>
    <!-- 1. Nhúng Header CSS và Bootstrap từ file dùng chung -->
    <div th:replace="~{common/header :: header-css}"></div>
</head>
<body>
    <!-- 2. Nhúng Thanh điều hướng (Navbar) -->
    <div th:replace="~{common/navbar :: header	}"></div>

    <div class="container mt-4">
        <div class="card shadow-sm">
            <div class="card-header bg-primary text-white d-flex justify-content-between align-items-center">
                <h4 class="mb-0">Danh sách các phòng hiện có</h4>
                <a href="/manager/rooms/add" class="btn btn-light btn-sm fw-bold">
                    + Thêm phòng mới
                </a>
            </div>
            
            <div class="card-body">
                <div class="table-responsive">
                    <table class="table table-hover align-middle">
                        <thead class="table-light">
                            <tr>
                                <th>ID</th>
                                <th>Số phòng</th>
                                <th>Loại phòng</th>
                                <th class="text-end">Giá/Đêm</th>
                                <th class="text-center">Sức chứa</th>
                                <!-- BỔ SUNG: Cột Thao tác -->
                                <th class="text-center">Thao tác</th>
                            </tr>
                        </thead>
                        <tbody>
                            <!-- Duyệt qua danh sách rooms từ Controller -->
                            <tr th:each="room : ${rooms}">
                                <td th:text="${room.id}"></td>
                                <td>
                                    <span class="badge bg-danger fs-6" th:text="${room.roomNumber}"></span>
                                </td>
                                <td th:text="${room.roomType.name}" class="fw-bold"></td>
                                <td class="text-end text-success fw-bold" 
                                    th:text="${#numbers.formatDecimal(room.roomType.pricePerNight, 0, 'COMMA', 0, 'POINT')} + ' VNĐ'">
                                </td>
                                <td class="text-center">
                                    <span class="badge rounded-pill bg-info text-dark" 
                                          th:text="${room.roomType.capacity} + ' người'">
                                    </span>
                                </td>
                                <!-- BỔ SUNG: Hai nút Sửa và Xóa -->
                                <td class="text-center">
                                    <div class="btn-group">
                                        <a th:href="@{/manager/rooms/edit/{id}(id=${room.id})}" 
                                           class="btn btn-sm btn-outline-info">
                                            Sửa
                                        </a>
                                        <a th:href="@{/manager/rooms/delete/{id}(id=${room.id})}" 
                                           class="btn btn-sm btn-outline-danger"
                                           onclick="return confirm('Anh Tú có chắc chắn muốn xóa phòng này không?')">
                                            Xóa
                                        </a>
                                    </div>
                                </td>
                            </tr>
                        </tbody>
                    </table>
                </div>
            </div>
        </div>
    </div>

    <!-- Nhúng thư viện JS của Bootstrap để các hiệu ứng hoạt động -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
