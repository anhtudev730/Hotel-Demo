<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Quản lý Loại Phòng</title>
    <!-- Nhúng Header dùng chung (Bootstrap & CSS) -->
    <div th:replace="~{common/header :: header-css}"></div>
</head>
<body>
    <!-- Nhúng Thanh điều hướng dùng chung -->
    <div th:replace="~{common/navbar :: header}"></div>

    <div class="container mt-4">
        <div class="card shadow-sm border-0">
            <div class="card-header bg-dark text-white d-flex justify-content-between align-items-center py-3">
                <h4 class="mb-0">
                    <i class="bi bi-door-open-fill me-2"></i>Danh Sách Loại Phòng
                </h4>
                <a href="/manager/room-types/add" class="btn btn-warning btn-sm fw-bold">
                    + Thêm loại phòng mới
                </a>
            </div>
            
            <div class="card-body">
                <div class="table-responsive">
                    <table class="table table-hover align-middle border">
                        <thead class="table-light">
                            <tr>
                                <th style="width: 80px;">ID</th>
                                <th>Tên Loại Phòng</th>
                                <th class="text-center">Sức chứa</th>
                                <th class="text-end">Giá/Đêm</th>
                                <th class="text-center">Thao tác</th>
                            </tr>
                        </thead>
                        <tbody>
                            <tr th:each="type : ${roomTypes}">
                                <td th:text="${type.id}" class="text-muted small"></td>
                                <td>
                                    <span class="fw-bold text-primary" th:text="${type.name}"></span>
                                </td>
                                <td class="text-center">
                                    <span class="badge rounded-pill bg-secondary" 
                                          th:text="${type.capacity} + ' người'">
                                    </span>
                                </td>
                                <td class="text-end text-dark fw-bold" 
                                    th:text="${#numbers.formatDecimal(type.pricePerNight, 0, 'COMMA', 0, 'POINT')} + ' VNĐ'">
                                </td>
                                <td class="text-center">
                                    <div class="btn-group shadow-sm">
                                        <!-- NÚT SỬA: Gửi ID lên URL để Controller tìm dữ liệu -->
                                        <a th:href="@{/manager/room-types/edit/{id}(id=${type.id})}" 
                                           class="btn btn-sm btn-outline-info">Sửa</a>
                                           
                                        <!-- NÚT XÓA: Có thêm Confirm để Anh Tú không bấm nhầm -->
                                        <a th:href="@{/manager/room-types/delete/{id}(id=${type.id})}" 
                                           class="btn btn-sm btn-outline-danger"
                                           onclick="return confirm('Bạn có chắc chắn muốn xóa loại phòng này không?')">Xóa</a>
                                    </div>
                                </td>
                            </tr>
                        </tbody>
                    </table>
                </div>
            </div>
        </div>
    </div>

    <!-- Bootstrap JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
