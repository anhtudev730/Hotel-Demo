<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Quản lý Đặt Phòng - Đào Hoa Hotel</title>
    <div th:replace="~{common/header :: header-css}"></div>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">
    <style>
        .status-pending { background-color: #fff3cd; color: #856404; border-radius: 20px; padding: 5px 15px; font-weight: 600; font-size: 0.85rem; }
        .status-confirmed { background-color: #d4edda; color: #155724; border-radius: 20px; padding: 5px 15px; font-weight: 600; font-size: 0.85rem; }
        .status-cancelled { background-color: #f8d7da; color: #721c24; border-radius: 20px; padding: 5px 15px; font-weight: 600; font-size: 0.85rem; }
        .table-card { border: none; border-radius: 15px; box-shadow: 0 0.5rem 1rem rgba(0, 0, 0, 0.1); }
        .btn-action { border-radius: 8px; transition: all 0.3s; }
        .btn-action:hover { transform: translateY(-2px); }
    </style>
</head>
<body class="bg-light">
    <div th:replace="~{common/navbar :: header}"></div>

    <div class="container mt-4">
        <div class="d-flex justify-content-between align-items-center mb-4">
            <div>
                <nav aria-label="breadcrumb">
                    <ol class="breadcrumb mb-1">
                        <li class="breadcrumb-item"><a href="/manager/dashboard">Dashboard</a></li>
                        <li class="breadcrumb-item active">Quản lý Đặt Phòng</li>
                    </ol>
                </nav>
                <h2 class="fw-bold text-secondary"><i class="bi bi-clipboard-data me-2"></i>Danh Sách Đặt Phòng</h2>
            </div>
            <a href="/manager/dashboard" class="btn btn-outline-secondary btn-action">
                <i class="bi bi-arrow-left"></i> Quay lại Dashboard
            </a>
        </div>

        <div class="card table-card">
            <div class="card-body p-0">
                <div class="table-responsive">
                    <table class="table table-hover align-middle mb-0">
                        <thead class="table-light">
                            <tr>
                                <th class="ps-4">Mã Đơn</th>
                                <th>Khách Hàng</th>
                                <th>Thông Tin Phòng</th>
                                <th>Thời Gian Lưu Trú</th>
                                <th>Tổng Tiền</th>
                                <th>Trạng Thái</th>
                                <th class="text-center pe-4">Hành Động</th>
                            </tr>
                        </thead>
                        <tbody>
                            <tr th:each="b : ${bookings}">
                                <td class="ps-4 fw-bold text-primary" th:text="'#' + ${b.id}"></td>
                                <td>
                                    <div class="d-flex align-items-center">
                                        <div class="rounded-circle bg-secondary text-white d-flex justify-content-center align-items-center me-2" style="width: 35px; height: 35px;">
                                            <i class="bi bi-person"></i>
                                        </div>
                                        <span th:text="${b.user?.username}">Username</span>
                                    </div>
                                </td>
                                <td>
                                    <div class="fw-bold" th:text="${b.room?.roomNumber != null ? 'P.' + b.room.roomNumber : 'N/A'}"></div>
                                    <small class="text-muted" th:text="${b.room?.roomType?.name}">Loại phòng</small>
                                </td>
                                <td>
                                    <div><i class="bi bi-calendar-event me-1 text-success"></i><span th:text="${b.checkInDate}"></span></div>
                                    <div><i class="bi bi-calendar-x me-1 text-danger"></i><span th:text="${b.checkOutDate}"></span></div>
                                </td>
                                <td>
                                    <span class="fw-bold text-danger" 
                                          th:text="${#numbers.formatDecimal(b.totalPrice, 0, 'COMMA', 0, 'POINT')} + ' đ'"></span>
                                </td>
                                <td>
                                    <span th:if="${b.status == 'PENDING'}" class="status-pending">
                                        <i class="bi bi-hourglass-split"></i> Chờ duyệt
                                    </span>
                                    <span th:if="${b.status == 'CONFIRMED'}" class="status-confirmed">
                                        <i class="bi bi-check-circle-fill"></i> Đã xác nhận
                                    </span>
                                    <span th:if="${b.status == 'CANCELLED'}" class="status-cancelled">
                                        <i class="bi bi-x-circle-fill"></i> Đã hủy
                                    </span>
                                </td>
                                <td class="text-center pe-4">
                                    <div th:if="${b.status == 'PENDING'}" class="btn-group">
                                        <a th:href="@{/manager/bookings/confirm/{id}(id=${b.id})}" 
                                           class="btn btn-sm btn-success btn-action me-2">
                                            <i class="bi bi-check-lg"></i> Duyệt
                                        </a>
                                        <a th:href="@{/manager/bookings/cancel/{id}(id=${b.id})}" 
                                           class="btn btn-sm btn-danger btn-action"
                                           onclick="return confirm('Bạn có chắc chắn muốn hủy đơn này?')">
                                            <i class="bi bi-trash"></i> Hủy
                                        </a>
                                    </div>
                                    <span th:unless="${b.status == 'PENDING'}" class="text-muted small italic">Hoàn tất</span>
                                </td>
                            </tr>
                        </tbody>
                    </table>
                </div>
            </div>
            <div th:if="${#lists.isEmpty(bookings)}" class="card-body text-center py-5">
                <i class="bi bi-inbox fs-1 text-muted"></i>
                <p class="mt-3 text-muted">Hiện chưa có đơn đặt phòng nào.</p>
            </div>
        </div>
    </div>

    <div th:if="${param.confirmed}" class="position-fixed bottom-0 end-0 p-3" style="z-index: 11">
        <div class="toast show align-items-center text-white bg-success border-0" role="alert">
            <div class="d-flex">
                <div class="toast-body">Xác nhận đơn phòng thành công!</div>
                <button type="button" class="btn-close btn-close-white me-2 m-auto" data-bs-dismiss="toast"></button>
            </div>
        </div>
    </div>
</body>
</html>
