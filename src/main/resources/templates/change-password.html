<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
    <meta charset="UTF-8">
    <title>Đổi mật khẩu - Hotel Manager</title>
    <div th:replace="~{common/header :: header-css}"></div>
</head>
<body>
    <!-- Sử dụng đúng fragment 'header' bạn vừa sửa lỗi thành công -->
    <div th:replace="~{common/navbar :: header}"></div>

    <div class="container mt-5">
        <div class="row justify-content-center">
            <div class="col-md-5">
                <div class="card shadow border-0">
                    <div class="card-header bg-dark text-white text-center py-3">
                        <h5 class="mb-0 text-uppercase">Thay đổi mật khẩu</h5>
                    </div>
                    <div class="card-body p-4">
                        <div th:if="${error}" class="alert alert-danger small" th:text="${error}"></div>
                        <div th:if="${success}" class="alert alert-success small" th:text="${success}"></div>

                        <form th:action="@{/change-password}" method="post">
                            <div class="mb-3">
                                <label class="form-label small fw-bold">Mật khẩu hiện tại</label>
                                <input type="password" name="oldPassword" class="form-control" required>
                            </div>
                            <hr>
                            <div class="mb-3">
                                <label class="form-label small fw-bold">Mật khẩu mới</label>
                                <input type="password" name="newPassword" class="form-control" required>
                            </div>
                            <div class="mb-3">
                                <label class="form-label small fw-bold">Xác nhận mật khẩu mới</label>
                                <input type="password" name="confirmPassword" class="form-control" required>
                            </div>
                            <div class="d-grid mt-4">
                                <button type="submit" class="btn btn-primary fw-bold">CẬP NHẬT MẬT KHẨU</button>
                            </div>
                        </form>
                    </div>
                </div>
            </div>
        </div>
    </div>
</body>
</html>
