<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Đặt phòng - ĐÀO HOA HOTEL</title>
    <div th:replace="~{common/header :: header-css}"></div>
</head>
<body>
    <div th:replace="~{common/navbar :: header}"></div>

    <div class="container mt-5">
        <div class="row justify-content-center">
            <div class="col-md-6">
                <div class="card shadow border-0">
                    <div class="card-header bg-success text-white text-center py-3">
                        <h5 class="mb-0 fw-bold"><i class="bi bi-suitcase-lg"></i> XÁC NHẬN ĐẶT PHÒNG</h5>
                    </div>
                    <div class="card-body p-4">
                        <div th:if="${error}" class="alert alert-danger shadow-sm" th:text="${error}"></div>
                        
                        <div class="mb-4 text-center border-bottom pb-3">
                            <h4 class="text-primary fw-bold" th:text="'Phòng số: ' + ${room.roomNumber}"></h4>
                            <span class="badge bg-info text-dark mb-2" th:text="${room.roomType?.name}"></span>
                            <p class="text-danger fw-bold mb-0" 
                               th:text="${#numbers.formatDecimal(room.roomType?.pricePerNight, 0, 'COMMA', 0, 'POINT')} + ' VNĐ/đêm'"></p>
                        </div>

                        <form th:action="@{/booking/save}" th:object="${booking}" method="post">
                            <input type="hidden" th:field="*{room.id}">

                            <div class="row">
                                <div class="col-md-6 mb-3">
                                    <label class="form-label fw-bold small text-uppercase">Ngày nhận phòng</label>
                                    <input type="date" th:field="*{checkInDate}" class="form-control" id="checkInDate" required>
                                </div>
                                <div class="col-md-6 mb-3">
                                    <label class="form-label fw-bold small text-uppercase">Ngày trả phòng</label>
                                    <input type="date" th:field="*{checkOutDate}" class="form-control" id="checkOutDate" required>
                                </div>
                            </div>

                            <div class="d-grid mt-4 gap-2">
                                <button type="submit" class="btn btn-success fw-bold btn-lg shadow-sm">XÁC NHẬN NGAY</button>
                                <a th:href="@{/}" class="btn btn-outline-secondary">Hủy bỏ</a>
                            </div>
                        </form>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script>
        document.addEventListener('DOMContentLoaded', function() {
            // Ngăn người dùng chọn ngày trong quá khứ
            const today = new Date().toISOString().split('T')[0];
            document.getElementById('checkInDate').min = today;
            document.getElementById('checkOutDate').min = today;
            
            // Tự động cập nhật ngày trả phòng tối thiểu dựa trên ngày nhận phòng
            const checkInInput = document.getElementById('checkInDate');
            const checkOutInput = document.getElementById('checkOutDate');
            
            checkInInput.addEventListener('change', function() {
                checkOutInput.min = this.value;
            });
        });
    </script>
</body>
</html>
