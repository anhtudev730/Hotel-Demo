<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Phòng đã đặt - ĐÀO HOA HOTEL</title>
    <div th:replace="~{common/header :: header-css}"></div>
</head>
<body>
    <div th:replace="~{common/navbar :: header}"></div>

    <div class="container mt-5">
        <h2 class="mb-4 text-primary fw-bold">DANH SÁCH PHÒNG BẠN ĐÃ ĐẶT</h2>
        
        <div th:if="${param.success}" class="alert alert-success">
            Chúc mừng Anh Tú! Bạn đã đặt phòng thành công.
        </div>

        <table class="table table-hover shadow-sm">
            <thead class="table-dark">
                <tr>
                    <th>Mã Đơn</th>
                    <th>Phòng</th>
                    <th>Loại</th>
                    <th>Ngày Nhận</th>
                    <th>Ngày Trả</th>
                    <th>Tổng Tiền</th>
                    <th>Trạng Thái</th>
                </tr>
            </thead>
            <tbody>
                <tr th:each="b : ${bookings}">
                    <td th:text="${b.id}"></td>
                    <td th:text="${b.room?.roomNumber}"></td>
                    <td th:text="${b.room?.roomType?.name}"></td>
                    <td th:text="${b.checkInDate}"></td>
                    <td th:text="${b.checkOutDate}"></td>
                    <td class="fw-bold text-danger" 
                        th:text="${#numbers.formatDecimal(b.totalPrice, 0, 'COMMA', 0, 'POINT')} + ' VNĐ'"></td>
                    <td>
                        <span class="badge" 
                              th:classappend="${b.status == 'PENDING' ? 'bg-warning' : 'bg-success'}"
                              th:text="${b.status}"></span>
                    </td>
                </tr>
            </tbody>
        </table>
        
        <div class="mt-3">
            <a th:href="@{/}" class="btn btn-secondary">Quay lại trang chủ</a>
        </div>
    </div>
</body>
</html>
