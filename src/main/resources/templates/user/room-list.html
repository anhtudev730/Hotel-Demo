<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Danh sách phòng - Đào Hoa Hotel</title>
    <div th:replace="~{common/header :: header-css}"></div>
</head>
<body>
    <div th:replace="~{common/navbar :: header}"></div>

    <div class="container mt-4">
        <div class="card p-4 mb-5 shadow-sm border-0 bg-white">
            <h4 class="mb-3 text-secondary"><i class="bi bi-search"></i> Tìm kiếm phòng trống</h4>
            <form th:action="@{/rooms/search}" method="get" class="row g-3">
                <div class="col-md-3">
                    <label class="form-label small fw-bold">Tên/Số phòng</label>
                    <input type="text" name="name" class="form-control" placeholder="Nhập số phòng...">
                </div>
                <div class="col-md-3">
                    <label class="form-label small fw-bold">Loại phòng</label>
                    <select name="typeId" class="form-select">
                        <option value="">-- Tất cả --</option>
                        <option th:each="type : ${roomTypes}" 
                                th:value="${type.id}" 
                                th:text="${type.typeName}"></option>
                    </select>
                </div>
                <div class="col-md-2">
                    <label class="form-label small fw-bold">Giá từ</label>
                    <input type="number" name="minPrice" class="form-control" placeholder="0">
                </div>
                <div class="col-md-2">
                    <label class="form-label small fw-bold">Đến</label>
                    <input type="number" name="maxPrice" class="form-control" placeholder="9.000.000">
                </div>
                <div class="col-md-2 d-flex align-items-end">
                    <button type="submit" class="btn btn-primary w-100 fw-bold">Lọc phòng</button>
                </div>
            </form>
        </div>

        <h3 class="mb-4">Kết quả tìm thấy: <span class="text-primary" th:text="${rooms.size()}">0</span> phòng</h3>
        
        <div class="row">
            <div class="col-md-4 mb-4" th:each="room : ${rooms}">
                <div class="card h-100 shadow-sm hover-shadow transition">
                    <img src="https://images.unsplash.com/photo-1611892440504-42a792e24d32?q=80&w=500&auto=format&fit=crop" 
                         class="card-img-top" alt="Hotel Room">
                    
                    <div class="card-body">
                        <div class="d-flex justify-content-between align-items-start mb-2">
                            <h5 class="card-title fw-bold mb-0" th:text="'Phòng ' + ${room.roomNumber}"></h5>
                            <span class="badge bg-success" th:text="${room.roomType.typeName}">Loại phòng</span>
                        </div>
                        
                        <p class="text-muted small"><i class="bi bi-info-circle"></i> Phòng sạch sẽ, đầy đủ tiện nghi, view thoáng mát.</p>
                        
                        <div class="mt-3 border-top pt-3 d-flex justify-content-between align-items-center">
                            <div>
                                <span class="text-danger fw-bold fs-5" 
                                      th:text="${#numbers.formatDecimal(room.roomType.pricePerNight, 0, 'COMMA', 0, 'POINT')} + ' đ'"></span>
                                <small class="text-muted">/ đêm</small>
                            </div>
                            <a th:href="@{/booking/{id}(id=${room.id})}" class="btn btn-outline-primary fw-bold">Đặt ngay</a>
                        </div>
                    </div>
                </div>
            </div>
        </div>

        <div th:if="${rooms.isEmpty()}" class="text-center py-5">
            <i class="bi bi-emoji-frown display-1 text-muted"></i>
            <p class="mt-3 fs-4 text-muted">Rất tiếc, không tìm thấy phòng phù hợp với yêu cầu của bạn!</p>
            <a href="/rooms/list" class="btn btn-link">Xem tất cả phòng</a>
        </div>
    </div>

    <style>
        .hover-shadow:hover { transform: translateY(-5px); box-shadow: 0 10px 20px rgba(0,0,0,0.1) !important; }
        .transition { transition: all 0.3s ease; }
    </style>
</body>
</html>
